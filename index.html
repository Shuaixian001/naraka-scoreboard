function deleteGroup(name) {
  const ev = getActiveEvent(); if (!ev) return;
  const n = ev.competitors.filter(function(c) { return c.group === name; }).length;
  if (!confirm('删除「' + name + ' 组」？组内 ' + n + ' 人将变为未分组，其历史成绩保留。')) return;
  ev.groups = ev.groups.filter(function(g) { return g !== name; });
  ev.competitors.forEach(function(c) { if (c.group === name) c.group = null; });
  ev.matches.forEach(function(m) { m.groups = m.groups.filter(function(g) { return g !== name; }); });
  if (lbFilter.group === name) lbFilter = { board: 'merged', group: null };
  saveState(); renderAll();
}

function randomGroupDialog() {
  const ev = getActiveEvent(); if (!ev) return;
  if (ev.competitors.length < 2) { alert('至少需要 2 名参赛者'); return; }
  const input = prompt('分成几个组？', String(Math.min(4, ev.competitors.length)));
  if (input == null) return;
  const n = Math.floor(Number(input));
  if (!(n >= 2 && n <= 12)) { alert('组数需在 2-12 之间'); return; }
  if (n > ev.competitors.length) { alert('组数不能超过参赛人数'); return; }
  if (!confirm('将随机平均分为 ' + n + ' 组，覆盖现有分组。确认？')) return;

  // 目标组名：优先沿用现有名字，不够再新建
  const oldGroups = ev.groups.slice();
  const targets = [];
  for (let i = 0; i < n; i++) {
    if (oldGroups[i]) { targets.push(oldGroups[i]); continue; }
    const free = GROUPS.filter(function(g) { return targets.indexOf(g) === -1 && oldGroups.indexOf(g) === -1; })[0];
    targets.push(free || ('组' + (i + 1)));
  }
  // 旧组名 → 目标组名（多余的组并入前面的组），对局引用同步改写，避免指向已不存在的组
  const remap = {};
  oldGroups.forEach(function(g, i) { remap[g] = targets[i % n]; });
  ev.groups = targets;
  ev.competitors.forEach(function(c) { if (c.group) c.group = remap[c.group] || null; });
  ev.matches.forEach(function(m) {
    const seen = {};
    m.groups = m.groups.map(function(g) { return remap[g]; }).filter(function(g) {
      return g && !seen[g] && (seen[g] = 1);
    });
  });

  const arr = ev.competitors.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  arr.forEach(function(c, i) { c.group = ev.groups[i % n]; });
  saveState(); renderAll();
}

/* ==========================================================================
   交互：比赛
   ========================================================================== */
function addMatch() {
  const ev = getActiveEvent(); if (!ev) return;
  const groups = (lbFilter.board === 'group' && lbFilter.group) ? [lbFilter.group] : [];
  // 第一局默认设为武道对局
  const type = ev.matches.length === 0 ? 'wudao' : 'tianti';
  ev.matches.push({ id: uid(), name: '', type: type, groups: groups, results: {} });
  saveState(); renderAll();
}

function setMatchType(id, t) {
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === id; })[0]; if (!m) return;
  const next = (t === 'wudao') ? 'wudao' : 'tianti';
  if (m.type === next) return;
  m.type = next;
  saveState(); renderAll();
}

function renameMatch(id) {
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === id; })[0]; if (!m) return;
  const name = prompt('本局备注（可留空）', m.name || '');
  if (name == null) return;
  m.name = name.trim();
  saveState(); renderAll();
}

function deleteMatch(id) {
  const ev = getActiveEvent(); if (!ev) return;
  const i = ev.matches.findIndex(function(x) { return x.id === id; });
  if (i < 0) return;
  if (!confirm('删除「第' + cnNum(i + 1) + '局」？该局所有数据也会删除。')) return;
  ev.matches.splice(i, 1);
  saveState(); renderAll();
}

function clearMatch(id) {
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === id; })[0]; if (!m) return;
  if (!confirm('清空本局已录入的成绩？')) return;
  m.results = {};
  saveState(); renderAll();
}

function moveMatch(id, dir) {
  const ev = getActiveEvent(); if (!ev) return;
  const i = ev.matches.findIndex(function(x) { return x.id === id; });
  const j = i + dir;
  if (i < 0 || j < 0 || j >= ev.matches.length) return;
  const t = ev.matches[i]; ev.matches[i] = ev.matches[j]; ev.matches[j] = t;
  saveState(); renderAll();
}

function setMatchGroups(id, val) {
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === id; })[0]; if (!m) return;
  m.groups = [];
  saveState(); renderAll();
}

function toggleMatchGroup(id, g) {
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === id; })[0]; if (!m) return;
  const idx = m.groups.indexOf(g);
  if (idx === -1) m.groups.push(g); else m.groups.splice(idx, 1);
  saveState(); renderAll();
}

/* ---------- 单局最高分并列裁定 ---------- */
function openTopPick(matchId) {
  const ev = getActiveEvent(); if (!ev) return;
  const S = computeStandings(ev);
  const i = S.matches.findIndex(function(x) { return x.id === matchId; });
  if (i < 0) return;
  const meta = S.matches[i];
  if (meta.bestT == null || meta.tiedIds.length < 2) { alert('本局没有并列的最高分，无需裁定。'); return; }

  pickCtx = { matchId: matchId, value: meta.topPick || '' };

  // 官方单局同分顺序：单局总分 → 击败分 → 生存排名，作为默认选项
  const cands = meta.tiedIds.map(function(cid) {
    return { cid: cid, name: S.byId[cid].comp.name, g: S.byId[cid].games[i] };
  }).sort(function(a, b) {
    if (b.g.killT !== a.g.killT) return b.g.killT - a.g.killT;
    const pa = a.g.placement == null ? 9999 : a.g.placement;
    const pb = b.g.placement == null ? 9999 : b.g.placement;
    return pa - pb;
  });
  const auto = cands[0].cid;
  const sel = pickCtx.value || auto;

  document.getElementById('pick-title').textContent = '裁定「' + meta.label + '」的单局最高分';
  document.getElementById('pick-desc').innerHTML =
    '本局最高分 <b>' + fmtT(meta.bestT) + '</b> 分，共 <b>' + meta.tiedIds.length + '</b> 人并列。<br>' +
    '选择要高亮的那一个。官方同分顺序为「单局总分 → 击败分 → 生存排名」，已默认选中符合该顺序的人。<br>' +
    '<span class="muted">此项只影响积分榜每局列的高亮显示，不参与冠军判定。</span>';

  let h = cands.map(function(c) {
    const isAuto = c.cid === auto;
    return '<label class="pick-row">' +
      '<input type="radio" name="pick-opt" value="' + c.cid + '"' + (c.cid === sel ? ' checked' : '') + '>' +
      '<b>' + esc(c.name) + '</b>' +
      '<span>' + fmtT(c.g.totalT) + ' 分 · 击败 ' + c.g.kills + ' · 名次 ' + (c.g.placement != null ? c.g.placement : '—') +
      (isAuto ? ' ← 官方顺序' : '') + '</span></label>';
  }).join('');
  h += '<label class="pick-row">' +
    '<input type="radio" name="pick-opt" value=""' + (pickCtx.value ? '' : '') + '>' +
    '<b class="muted">不裁定</b><span>并列的人全部高亮</span></label>';
  document.getElementById('pick-options').innerHTML = h;

  document.getElementById('pick-modal').className = 'modal';
}

function closeTopPick() {
  pickCtx = null;
  document.getElementById('pick-modal').className = 'modal hidden';
}

function confirmTopPick() {
  if (!pickCtx) return;
  const ev = getActiveEvent(); if (!ev) return;
  const m = ev.matches.filter(function(x) { return x.id === pickCtx.matchId; })[0];
  const el = document.querySelector('input[name="pick-opt"]:checked');
  const v = el ? el.value : '';
  const matchId = pickCtx.matchId;
  closeTopPick();
  if (!m) return;
  m.topPick = v || null;
  saveState();
  renderAll();
}

/* ---------- 录入与定点更新 ---------- */
function onResultInput(el) {
  const ev = getActiveEvent(); if (!ev) return;
  const matchId = el.dataset.m, compId = el.dataset.c, field = el.dataset.f;
  const m = ev.matches.filter(function(x) { return x.id === matchId; })[0]; if (!m) return;
  if (!m.results[compId]) m.results[compId] = { kills: null, placement: null };
  const raw = el.value.trim();
  m.results[compId][field] = raw === '' ? null : Number(raw);

  scheduleSave();
  refreshDerived();
}

/* 定点更新：绝不重建带有输入框的 DOM（否则丢焦点）。
   bonus 依赖历史，改第二局会影响后面几局的赛点分，所以必须刷新所有对局的格子。 */
function refreshDerived() {
  const ev = getActiveEvent(); if (!ev) return;
  const S = computeStandings(ev);
  renderLeaderboard(ev, S);

  const gameOf = function(cid, mid) {
    const row = S.byId[cid];
    if (!row) return null;
    for (let i = 0; i < row.games.length; i++) if (row.games[i].matchId === mid) return row.games[i];
    return null;
  };

  document.querySelectorAll('table.grid td[data-mid][data-cid]').forEach(function(td) {
    const g = gameOf(td.dataset.cid, td.dataset.mid);
    if (td.dataset.st) {
      td.innerHTML = (g && g.openedBefore) ? '<span class="mp-badge">🔥</span>' : '';
      return;
    }
    td.innerHTML = scoreCellHTML(g);
    td.classList.toggle('zero', !g || !g.hasResult || g.totalT === 0);
  });
  S.matches.forEach(function(meta) {
    const el = document.getElementById('stat-' + meta.id);
    if (el) el.textContent = matchStatsText(meta);
    const rowEls = document.querySelectorAll('#matchbody-' + meta.id + ' tbody tr[data-comp]');
    rowEls.forEach(function(tr) {
      const g = gameOf(tr.dataset.comp, meta.id);
      tr.classList.toggle('pending', !g || !g.hasResult);
    });
  });
}

function onCellKeydown(e, el) {
  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const mid = el.dataset.m, cid = el.dataset.c, field = el.dataset.f;
  const body = document.getElementById('matchbody-' + mid);
  if (!body) return;
  const rows = Array.prototype.filter.call(
    body.querySelectorAll('tbody tr[data-comp]'),
    function(tr) { return !tr.classList.contains('hidden'); }
  );
  const idx = rows.findIndex(function(tr) { return tr.dataset.comp === cid; });
  if (idx < 0) return;
  const dir = e.key === 'ArrowUp' ? -1 : 1;
  const next = rows[idx + dir];
  if (!next) return;
  const input = next.querySelector('input[data-f="' + field + '"]');
  if (input) { input.focus(); input.select(); }
}

function filterMatchRows(mid, q) {
  const body = document.getElementById('matchbody-' + mid);
  if (!body) return;
  const ev = getActiveEvent();
  const key = q.trim().toLowerCase();
  body.querySelectorAll('tbody tr[data-comp]').forEach(function(tr) {
    const c = ev.competitors.filter(function(x) { return x.id === tr.dataset.comp; })[0];
    const hay = c ? (c.name + ' ' + c.members.join(' ')).toLowerCase() : '';
    tr.classList.toggle('hidden', !!key && hay.indexOf(key) === -1);
  });
}

function jumpToPending(mid) {
  const body = document.getElementById('matchbody-' + mid);
  if (!body) return;
  const tr = body.querySelector('tbody tr.pending:not(.hidden)');
  if (!tr) { alert('本局已全部录入'); return; }
  tr.scrollIntoView({ block: 'center', behavior: 'smooth' });
  const input = tr.querySelector('input');
  if (input) input.focus();
}

/* ==========================================================================
   交互：设置
   ========================================================================== */
function saveSettings() {
  const ev = getActiveEvent(); if (!ev) return;
  ev.name = document.getElementById('set-name').value.trim() || ev.name;

  const fmt = document.querySelector('input[name="set-format"]:checked').value;
  ev.matchPoint.enabled = (fmt === 'matchPoint');
  if (ev.matchPoint.enabled) {
    const th = num(document.getElementById('set-mp-threshold').value);
    if (th == null || th <= 0) { alert('赛点分数需大于 0'); return; }
    ev.matchPoint.threshold = th;
    const mx = num(document.getElementById('set-mp-max').value);
    if (mx == null || mx < 1) { alert('最多局数需 ≥ 1'); return; }
    ev.matchPoint.maxMatches = Math.floor(mx);
    ev.matchPoint.bonusEnabled = document.getElementById('set-mp-bonus').checked;
    const st = num(document.getElementById('set-mp-step').value);
    ev.matchPoint.bonusStep = (st != null && st >= 0) ? st : 0;
    ev.matchPoint.sameGameCanWin = document.getElementById('set-mp-same').checked;
    const ov = document.getElementById('set-mp-override').value;
    ev.matchPoint.championOverride = ov ? { compId: ov } : null;
  }

  const kp = num(document.getElementById('set-kill').value);
  if (kp == null || kp < 0) { alert('击败分需 ≥ 0'); return; }
  ev.scoring.killPoints = kp;

  commitPlaceEditor();
  ev.scoring.placement = placeDraft.tianti;
  ev.scoring.wudaoPlacement = placeDraft.wudao;

  normalize(ev);
  saveState();
  renderAll();
  alert('已保存');
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '永劫无间积分数据.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    try {
      const data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.events)) throw new Error('bad');
      state = data;
      state.events.forEach(normalize);
      if (!state.events.some(function(e) { return e.id === state.activeEventId; })) {
        state.activeEventId = state.events[0].id;
      }
      lbFilter = { board: 'merged', group: null };
      lastChampionKey = null;
      saveState();
      renderAll();
      alert('导入成功');
    } catch (e) {
      alert('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* 赛制单选切换时立刻显示/隐藏赛点区块 */
document.addEventListener('change', function(e) {
  if (e.target && e.target.name === 'set-format') {
    document.getElementById('set-mp-block').className = (e.target.value === 'matchPoint') ? '' : 'hidden';
  }
});

init();
</script>
